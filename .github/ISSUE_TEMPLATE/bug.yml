name: Reporte de error
description: Algo no funciona como se espera.
title: "fix: "
labels: [bug]
body:
  - type: textarea
    id: que-pasa
    attributes:
      label: ¿Qué pasa?
      description: Describe el error. No incluyas contraseñas, tokens ni datos personales.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: "1. Entra a…\n2. Pulsa…\n3. Aparece…"
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: ¿Qué esperabas que pasara?
    validations:
      required: true
  - type: dropdown
    id: entorno
    attributes:
      label: Entorno
      options: [Producción (Azure), Local, Otro]
    validations:
      required: true
  - type: textarea
    id: evidencia
    attributes:
      label: Capturas o registros
