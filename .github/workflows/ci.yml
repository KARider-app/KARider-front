name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_dispatch:

# Mínimo privilegio para GITHUB_TOKEN (solo leer el código).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts: no ejecuta scripts de instalación de terceros (cadena de suministro)
      - run: npm ci --ignore-scripts
      # Dependencias que llegan al navegador sin vulnerabilidades altas o críticas.
      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev --audit-level=high
      # Lint sin --fix: en CI se verifica, no se corrige (los scripts lint:* usan --fix para uso local).
      - name: Lint (oxlint + eslint)
        run: |
          npx oxlint .
          npx eslint . --max-warnings=0
      - name: Formato (prettier)
        run: npx prettier --check src/ deploy/
      - name: Tipos (vue-tsc)
        run: npm run type-check
      - run: npm run test:ci
      - run: npm run build
        env:
          # Solo para compilar en CI; el valor de producción lo define .github/workflows/deploy.yml
          VITE_API_BASE_URL: https://localhost
