# Actualizaciones automáticas de dependencias: Dependabot abre PR hacia develop, que pasan por CI y SonarCloud.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Parches y menores juntos en un solo PR; los cambios mayores se revisan uno por uno.
      menores:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci(deps)"
    groups:
      acciones:
        patterns: ["*"]
